<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reservation Received · &quot;KITCHEN ISLAND&quot;</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap");

      :root {
        --bg: #f3ebdf;
        --panel: rgba(255, 249, 243, 0.9);
        --ink: #1f1510;
        --muted: #695446;
        --line: rgba(31, 21, 16, 0.1);
        --shadow: 0 30px 100px rgba(31, 21, 16, 0.13);
        --radius: 34px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 14px;
        color: var(--ink);
        font-family: "Manrope", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(181, 136, 86, 0.22), transparent 26%),
          radial-gradient(circle at bottom right, rgba(31, 21, 16, 0.09), transparent 30%),
          linear-gradient(135deg, #ebdcc8 0%, #f8f1e7 42%, #e9ddd0 100%);
      }

      .card {
        width: min(720px, 100%);
        padding: 40px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      h1 {
        margin: 0 0 18px;
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(2.8rem, 7vw, 4.3rem);
        font-weight: 600;
        line-height: 0.92;
      }

      .copy {
        display: grid;
        gap: 12px;
        margin: 0 0 26px;
      }

      .copy p,
      .meta {
        margin: 0;
        color: var(--muted);
        line-height: 1.85;
      }

      .meta {
        font-size: 0.9rem;
      }

      a {
        display: inline-flex;
        padding: 16px 22px;
        border-radius: 999px;
        background: #281812;
        color: #fff9f4;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Reservation Received</h1>
      <div class="copy">
        <p>Thank you.</p><p>Your reservation has been submitted for review.</p><p>If approved, you'll receive an email containing your payment link.</p><p>Your reservation is only confirmed once payment has been received.</p>
      </div>
      <a href="/">Close</a>
      <p class="meta">Reference Preview</p>
    </main>
  </body>
</html>
